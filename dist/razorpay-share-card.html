<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #f7f9ff; font-family: Arial, sans-serif; background: #111827; }
      main { position: relative; width: 1200px; height: 630px; padding: 68px 78px; overflow: hidden; background: radial-gradient(circle at 88% 12%, #304b8e 0, transparent 31%), linear-gradient(135deg, #111827, #18233b); }
      main::after { position: absolute; right: -74px; bottom: -160px; width: 490px; height: 490px; content: ''; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; box-shadow: 0 0 0 46px rgba(255,255,255,.025), 0 0 0 92px rgba(255,255,255,.018); }
      .top { display: flex; align-items: center; gap: 15px; color: #aebbd1; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
      .top img { width: 128px; height: auto; }
      .top i { width: 5px; height: 5px; background: #7793ff; border-radius: 50%; }
      .company { display: flex; align-items: center; gap: 22px; margin: 75px 0 26px; }
      .company-logo { display: grid; place-items: center; width: 105px; height: 105px; overflow: hidden; background: white; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
      .company-logo img { width: 78px; height: 78px; object-fit: contain; }
      .company strong { font-size: 34px; }
      .company span { display: block; margin-top: 7px; color: #aebbd1; font-size: 20px; }
      h1 { max-width: 860px; margin: 0; font-size: 62px; letter-spacing: -2.8px; line-height: 1.06; }
      p { margin: 21px 0 0; color: #c0cad9; font-size: 24px; }
      .tags { display: flex; gap: 10px; margin-top: 29px; }
      .tags span { padding: 10px 14px; color: #d6dded; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); border-radius: 7px; font-size: 17px; }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><img src="/optqvo-logo.svg" alt="OPTQVO" /><i></i> ROLE BRIEF · INDIA</div>
      <div class="company"><div class="company-logo"><img src="https://logo.clearbit.com/razorpay.com" onerror="this.src='https://www.google.com/s2/favicons?domain=razorpay.com&sz=128'" alt="Razorpay" /></div><div><strong>Razorpay</strong><span>Engineering · Bengaluru, India</span></div></div>
      <h1>Software Development Engineer I</h1>
      <p>Role brief, application checklist and official apply link.</p>
      <div class="tags"><span>Full-time</span><span>0–2 years</span><span>OPTQVO</span></div>
    </main>
  </body>
</html>
